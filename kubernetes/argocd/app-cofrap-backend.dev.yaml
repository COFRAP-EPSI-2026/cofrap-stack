# ArgoCD Application — backend cofrap, env DEV.
#
# Source : le chart Helm vit dans le repo cofrap-backend (référencé en
# submodule par cofrap-stack). ArgoCD lit le repo cofrap-stack ; pour
# accéder au chart sous backend/, l'option `submoduleEnabled: true` doit
# être activée dans la config ArgoCD du repo (cf. argocd/README.md).
#
# Les overrides per-env vivent dans kubernetes/values/backend.dev.yaml — même
# fichier consommé par deploy.sh. Une seule source de vérité.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cofrap-backend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # --- ArgoCD Image Updater (auto-MAJ à chaque push dev) -------------------
  # En dev le tag est `:dev` (mobile) — stratégie digest : Image Updater suit
  # le SHA256 du tag et déclenche un redéploiement quand pre-release.yml
  # republie. On garde l'option B : 1 image watchée pour bump
  # `functions.version` partagé par les 3 fonctions.
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      backend=ghcr.io/cofrap-epsi-2026/generate-password
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/backend.allow-tags: "regexp:^dev$"
    argocd-image-updater.argoproj.io/backend.helm.image-tag: functions.version
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: "helmvalues:./kubernetes/values/backend.dev.yaml"
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default

  source:
    repoURL: https://github.com/COFRAP-EPSI-2026/cofrap-stack.git
    targetRevision: main
    path: backend/deploy/helm/cofrap
    helm:
      releaseName: cofrap-dev
      valueFiles:
        # Chemin relatif depuis `path` ci-dessus.
        - ../../../../kubernetes/values/backend.dev.yaml
      # Les secrets ne vivent PAS ici. Voir argocd/README.md pour Sealed Secrets,
      # External Secrets Operator ou la méthode "secrets pré-créés à la main".

  destination:
    server: https://kubernetes.default.svc
    namespace: cofrap-dev

  syncPolicy:
    automated:
      prune: true        # supprime les ressources retirées du Git
      selfHeal: true     # rollback auto si quelqu'un édite le cluster à la main
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  # Ignore les diffs sur les secrets (gérés hors ArgoCD).
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: mariadb-password
      namespace: openfaas-fn
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: encryption-key
      namespace: openfaas-fn
      jsonPointers: [/data]
