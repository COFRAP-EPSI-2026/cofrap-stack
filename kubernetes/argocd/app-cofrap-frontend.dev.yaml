# ArgoCD Application — frontend cofrap-frontend, env DEV.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cofrap-frontend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Annotations pour ArgoCD Image Updater (suit le tag `:dev` et reconcilie
  # automatiquement quand pre-release.yml pousse une nouvelle image).
  # Write-back dans le file Helm values via `helmvalues:` — Git source de vérité.
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      frontend=ghcr.io/cofrap-epsi-2026/cofrap-frontend
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.allow-tags: "regexp:^dev$"
    argocd-image-updater.argoproj.io/frontend.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: "helmvalues:./kubernetes/values/frontend.dev.yaml"
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default

  source:
    repoURL: https://github.com/COFRAP-EPSI-2026/cofrap-stack.git
    targetRevision: main
    path: frontend/deploy/helm/cofrap-frontend
    helm:
      releaseName: cofrap-frontend-dev
      valueFiles:
        - ../../../../kubernetes/values/frontend.dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cofrap-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
