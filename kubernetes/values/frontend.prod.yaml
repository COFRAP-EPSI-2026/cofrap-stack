# Override du chart `cofrap-frontend` pour l'environnement PROD.
# Référence des clés : frontend/deploy/helm/cofrap-frontend/values.yaml

image:
  repository: ghcr.io/cofrap-epsi-2026/cofrap-frontend
  # AUTO-MANAGED par ArgoCD Image Updater quand le GitOps est actif (Phase 2).
  # Bumpé automatiquement vers le dernier vX.Y.Z publié par release-please.yml.
  # Cf. kubernetes/argocd/app-cofrap-frontend.prod.yaml + argocd/README.md.
  # En Phase 1 (deploy.sh), ce champ est surchargé par --set image.tag.
  tag: "latest"
  pullPolicy: IfNotPresent

backend:
  gateway: gateway.openfaas.svc.cluster.local:8080

ingress:
  enabled: true
  className: traefik
  host: cofrap.home-maurras.fr
  path: /
  pathType: Prefix
  tls:
    enabled: false                               # TLS terminé par Cloudflare Tunnel
    secretName: ""
