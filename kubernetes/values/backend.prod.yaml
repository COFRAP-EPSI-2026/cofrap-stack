# Override du chart `cofrap` (backend) pour l'environnement PROD.
# Référence des clés : backend/deploy/helm/cofrap/values.yaml

# PROD = déploiement SCRIPTÉ (deploy.sh) par défaut : le chart CRÉE les secrets
# (secrets.create=true, défaut du chart) à partir des valeurs passées en --set par
# le script. On laisse donc ce champ au défaut (pas de override ici).
#
# >>> Pour basculer la PROD en GitOps ArgoCD plus tard <<<
# Décommente le bloc ci-dessous (secrets gérés hors Git, pré-créés via
# ./kubernetes/create-secrets.sh --env prod). Cf. kubernetes/README.md
# § « Activer ArgoCD en prod » + argocd/README.md.
# secrets:
#   create: false

openfaas:
  functionNamespace: openfaas-fn
  gatewayURL: "http://gateway.openfaas.svc.cluster.local:8080"

functions:
  registry: ghcr.io/cofrap-epsi-2026
  # AUTO-MANAGED par ArgoCD Image Updater quand le GitOps est actif (Phase 2).
  # Image Updater watche ghcr.io/cofrap-epsi-2026/generate-password et bump
  # cette ligne à chaque nouveau tag stable vX.Y.Z publié par release-please.yml.
  # Cf. kubernetes/argocd/app-cofrap-backend.prod.yaml + argocd/README.md.
  # En Phase 1 (deploy.sh), ce champ est surchargé par --set functions.version.
  version: "latest"
  pullPolicy: IfNotPresent
  corsAllowOrigins: "https://cofrap.home-maurras.fr"

mariadb:
  # Ressources plus généreuses en prod
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 2Gi
